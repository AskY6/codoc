services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cobook_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - cobook-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cobook_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cobook_dev
      PORT: 3100
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    command: node scripts/container-server.mjs
    ports:
      - "3100:3100"

  web:
    profiles: ["full-stack"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_started
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      VITE_API_PROXY_TARGET: http://server:3100
    command: pnpm --filter @cobook/web dev
    ports:
      - "5173:5173"

volumes:
  cobook-postgres-data:

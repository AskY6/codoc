<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobook Backend</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background: #f6efe5;
        color: #1d2938;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(182, 84, 43, 0.18), transparent 26%),
          linear-gradient(180deg, #f8f3ea 0%, #f4efe6 100%);
      }

      main {
        max-width: 720px;
        padding: 32px;
        border-radius: 24px;
        border: 1px solid rgba(29, 41, 56, 0.12);
        background: rgba(255, 252, 246, 0.92);
        box-shadow: 0 22px 60px rgba(78, 57, 35, 0.12);
      }

      p {
        line-height: 1.6;
      }

      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #b6542b;
      }

      code {
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(182, 84, 43, 0.12);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Cobook Backend</p>
      <h1>Workspace Console</h1>
      <p>
        This backend only serves the API and event stream. Start the full React dev experience from
        the repository root with <code>pnpm dev</code>, then open <code>http://127.0.0.1:5173</code>.
      </p>
    </main>
  </body>
  </html>

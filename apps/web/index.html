<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoDoc Inspector</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 1200px;
        margin: 24px auto;
        padding: 0 20px;
        line-height: 1.6;
        color: #1a1a1a;
      }
      h1 { margin-bottom: 0.5em; }
      h2 { margin-top: 1em; margin-bottom: 0.3em; }
      p { margin-bottom: 0.5em; }
      strong { color: #0066cc; }
      hr { margin: 1.5em 0; border: none; border-top: 1px solid #e0e0e0; }
      pre {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.85em;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* --- Ops Bar (top) --- */
      .ops-bar {
        padding: 12px 16px;
        background: #f5f5f5;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .ops-bar-title {
        font-size: 0.7em;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      .ops-bar-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .ops-btn {
        padding: 5px 12px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fff;
        font-family: 'SF Mono', Monaco, monospace;
        font-size: 0.78em;
        color: #1a1a1a;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .ops-btn:hover { background: #e8f0fe; border-color: #0066cc; }
      .ops-btn:active { background: #d0e2fc; }

      /* --- Three-zone layout --- */
      .inspector-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 16px;
        align-items: start;
      }
      .docs-column {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* --- Doc Panel --- */
      .doc-panel {
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px;
        background: #fafafa;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .doc-panel--selected {
        border-color: #0066cc;
      }
      .doc-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e0e0e0;
      }
      .doc-label {
        font-size: 0.75em;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .doc-tabs {
        display: flex;
        gap: 2px;
      }
      .doc-tab {
        padding: 2px 10px;
        border: 1px solid #d0d0d0;
        background: #fff;
        font-size: 0.7em;
        color: #666;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .doc-tab:first-child { border-radius: 4px 0 0 4px; }
      .doc-tab:last-child { border-radius: 0 4px 4px 0; }
      .doc-tab--active {
        background: #0066cc;
        border-color: #0066cc;
        color: #fff;
      }
      .codoc-source {
        font-family: 'SF Mono', Monaco, monospace;
        font-size: 0.82em;
        line-height: 1.5;
        background: #f0f0f0;
        padding: 12px;
        border-radius: 6px;
        overflow-x: auto;
        white-space: pre;
        max-height: 400px;
        overflow-y: auto;
      }

      /* --- DAG Panel --- */
      .dag-panel {
        position: sticky;
        top: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .dag-section {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 12px;
        background: #fafafa;
      }
      .dag-title {
        font-size: 0.7em;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid #e0e0e0;
      }
      .dag-layers {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .dag-layer {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .dag-layer-label {
        font-size: 0.65em;
        color: #999;
        font-family: 'SF Mono', Monaco, monospace;
        width: 20px;
        flex-shrink: 0;
      }
      .dag-node {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-family: 'SF Mono', Monaco, monospace;
        font-size: 0.75em;
        border: 1px solid #ccc;
        transition: background 0.3s;
      }
      .dag-edges {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px dashed #e0e0e0;
      }
      .dag-edge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75em;
        margin-bottom: 3px;
      }
      .dag-edge code {
        font-family: 'SF Mono', Monaco, monospace;
        background: none;
        padding: 0;
        font-size: 1em;
      }
      .dag-arrow {
        color: #999;
      }
      .dag-empty {
        color: #999;
        font-style: italic;
        font-size: 0.85em;
      }
      .dag-doc-nodes {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .dag-doc-node {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 4px;
        font-family: 'SF Mono', Monaco, monospace;
        font-size: 0.78em;
        background: #d4edda;
        border: 1px solid #b8d4be;
      }
      .dag-cross-edge {
        margin-bottom: 6px;
      }
      .dag-edge-details {
        margin-left: 26px;
        padding-left: 8px;
        border-left: 2px solid #e0e0e0;
      }
      .dag-edge-detail {
        font-family: 'SF Mono', Monaco, monospace;
        font-size: 0.7em;
        color: #666;
        line-height: 1.6;
      }

      /* --- Utility --- */
      .suspense-fallback { color: #999; font-style: italic; }
      .field-loading { color: #999; font-style: italic; }
      .error-boundary {
        color: #cc0000;
        background: #fff0f0;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #ffcccc;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

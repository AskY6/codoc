<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoDoc MVP</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
        color: #1a1a1a;
      }
      h1 { margin-bottom: 0.5em; }
      h2 { margin-top: 1em; margin-bottom: 0.3em; }
      p { margin-bottom: 0.5em; }
      strong { color: #0066cc; }
      .suspense-fallback {
        color: #999;
        font-style: italic;
      }
      .error-boundary {
        color: #cc0000;
        background: #fff0f0;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #ffcccc;
      }
      #console-hint {
        margin-top: 2em;
        padding: 16px;
        background: #f5f5f5;
        border-radius: 8px;
        font-size: 0.9em;
      }
      #console-hint code {
        background: #e0e0e0;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'SF Mono', Monaco, monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="console-hint">
      <strong>Try in DevTools console:</strong><br />
      <code>codoc.update("/title", "New Title")</code><br />
      <code>codoc.update("/count", 99)</code>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
